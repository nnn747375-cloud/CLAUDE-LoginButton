  <rect x="492" y="154" width="208" height="54" rx="14" fill="#EBE5DE" stroke="#BEB1A5"/>
  <text x="596" y="187" text-anchor="middle" fill="#7D7167" font-family="Arial,sans-serif" font-size="14">Signing in…</text>
