<svg xmlns="http://www.w3.org/2000/svg" width="760" height="286" viewBox="0 0 760 286" role="img" aria-labelledby="title desc">
  <title id="title">CLAUDE-LoginButton preview</title>
  <desc id="desc">A warm cream preview card showing the Continue with Claude button in idle, loading and connected states.</desc>
  <rect width="760" height="286" rx="24" fill="#F7F3ED"/>
  <path d="M42 42h676" stroke="#D9CFC5"/>
  <circle cx="66" cy="31" r="5" fill="#D97757"/><circle cx="84" cy="31" r="5" fill="#C9A995"/><circle cx="102" cy="31" r="5" fill="#292624"/>
