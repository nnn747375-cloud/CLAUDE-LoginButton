name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Build library
        run: dotnet build src/ClaudeLoginButton/ClaudeLoginButton.csproj --configuration Release
      - name: Build demo
        run: dotnet build examples/WinFormsDemo/WinFormsDemo.csproj --configuration Release
      - name: Publish standalone Windows EXE
        run: dotnet publish examples/WinFormsDemo/WinFormsDemo.csproj --configuration Release --runtime win-x64 --self-contained true --output dist-ci
